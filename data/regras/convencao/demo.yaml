# FICTICIO - dados de demonstracao, nao e convencao real.
# Convencao coletiva FICTICIA da empresa da demo, escrita pelo time (clean room). Nao reproduz CCT de sindicato, empresa ou cliente.
# Toda regra tem status: ficticia (ver data/regras/README.md). Deve aparecer como sintetico na submissao.

norma: "Convencao coletiva FICTICIA da demo (dados de demonstracao)"

regras:
  - id: adicional_hora_extra
    percentual_min: 60
    fonte: "FICTICIO - convencao de demonstracao; o minimo legal de 50% vem de CF art. 7º, XVI e CLT art. 59, § 1º"
    nota: >
      Percentual ficticio acima do minimo legal de 50%. A fatia usa este valor no custo da hora extra; sem
      esta regra, vale o minimo da lei (adicional_hora_extra em clt.yaml).
    status: ficticia
    verificacao: "n/a: dado ficticio, sem leitura de fonte real"

  - id: repouso_semanal
    dias: 2
    preferencia: "um deles preferencialmente aos domingos"
    vigencia: 2026-12-16
    fonte: "FICTICIO - convencao de demonstracao, alinhada a EC 141/2026 (art. 7º, XV CF; art. 10, I)"
    status: ficticia
    verificacao: "n/a: dado ficticio, sem leitura de fonte real"

