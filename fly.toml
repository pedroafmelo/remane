# Fly.io (DEC-030): 1 máquina sempre ligada e 1 volume para o SQLite. Nome do app: [PREENCHER] (precisa ser único no Fly).
app = "escalista-converge"
primary_region = "gru"

[build]

[env]
  DATABASE_URL = "sqlite:////data/escalista.db"
  WEB_DIST_DIR = "/app/web/dist"

[[mounts]]
  source = "escalista_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
