<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ShiftCell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .row { display: grid; grid-template-columns: repeat(5, minmax(0, 96px)); gap: 8px; }
  .lbl { font: 500 11px/1.3 var(--font-sans); color: var(--ink-muted); margin-top: 6px; text-align: center; }
  .cell { font: 500 12px/1 var(--font-sans); font-variant-numeric: tabular-nums; height: 38px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  .shift { background: var(--paper); }
  .off { color: var(--ink-subtle); border: 1px dashed var(--line-strong); }
  .sick { color: var(--ink-subtle); background: repeating-linear-gradient(135deg, var(--surface-chat) 0 6px, var(--line) 6px 12px); text-decoration: line-through; }
  .moved { background: var(--accent); box-shadow: var(--shadow-accent); animation: pop 4s ease-out infinite; }
  .open { background: var(--warning-soft); color: var(--warning-ink); border: 1px solid var(--warning); }
  @keyframes pop { 0%, 20% { transform: scale(.86); opacity: .35; } 32% { transform: scale(1.04); opacity: 1; } 40%, 100% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .moved { animation: none; } }
</style>
</head>
<body>
<div class="row">
  <div><div class="cell shift">7–15h</div><div class="lbl">turno</div></div>
  <div><div class="cell off">folga</div><div class="lbl">folga</div></div>
  <div><div class="cell sick">atestado</div><div class="lbl">ausência</div></div>
  <div><div class="cell moved">14–22h</div><div class="lbl">remanejado</div></div>
  <div><div class="cell open">14–22h ?</div><div class="lbl">descoberto</div></div>
</div>
</body>
</html>
