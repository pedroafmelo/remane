<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ChatBubble</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); font-family: var(--font-sans); color: var(--ink); }
  .phone { width: 340px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-float); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .who { display: flex; flex-direction: column; font-size: 14px; font-weight: 500; }
  .who small { font-size: 12px; font-weight: 400; color: var(--ink-muted); }
  .msgs { padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-chat); }
  .b { max-width: 80%; padding: 10px 12px; font-size: 13px; line-height: 1.4; animation: rise .5s ease-out both; }
  .in { align-self: flex-start; background: var(--surface); border-radius: 16px 16px 16px 4px; }
  .out { align-self: flex-end; background: var(--accent-soft); border-radius: 16px 16px 4px 16px; }
  .sys { align-self: center; font-size: 12px; color: var(--ink-muted); background: var(--surface); border-radius: var(--radius-full); padding: 6px 12px; animation: rise .5s ease-out both; }
  .att { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-muted); background: var(--paper); border-radius: 8px; padding: 6px 8px; }
  .d1 { animation-delay: .3s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 2.1s; } .d4 { animation-delay: 3s; }
  .ink { fill: var(--ink); } .wh { fill: var(--surface); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .b, .sys { animation: none; } }
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <div class="av"><svg width="18" height="17" viewBox="0 0 70 64" aria-hidden="true"><rect class="ink" x="4" y="4" width="16" height="16" rx="5"/><rect class="ink" x="24" y="4" width="16" height="16" rx="5"/><rect class="ink" x="44" y="4" width="16" height="16" rx="5"/><rect class="ink" x="4" y="24" width="16" height="16" rx="5"/><rect class="ink" x="24" y="24" width="16" height="16" rx="5"/><rect class="wh" x="50" y="18" width="16" height="16" rx="5"/><rect class="ink" x="4" y="44" width="16" height="16" rx="5"/><rect class="ink" x="24" y="44" width="16" height="16" rx="5"/><rect class="ink" x="44" y="44" width="16" height="16" rx="5"/></svg></div>
    <div class="who">Remane<small>agente da Loja Boa Viagem</small></div>
  </div>
  <div class="msgs">
    <div class="b in d1">Bom dia, não vou conseguir ir hoje. Mandei o atestado.<span class="att">atestado.jpg · 1 dia</span></div>
    <div class="b out d2">Recebi, Joana. Atestado ok, melhoras. Já estou cobrindo seu turno das 14h.</div>
    <div class="sys d3">Carlos aceitou o turno · sem hora extra</div>
    <div class="b out d4">Pronto, turno coberto. A gestora já foi avisada.</div>
  </div>
</div>
</body>
</html>
